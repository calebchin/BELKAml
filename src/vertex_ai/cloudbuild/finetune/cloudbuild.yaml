steps:
# Step 1: Build training component Docker image (shared with finetune)
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'northamerica-northeast2-docker.pkg.dev/${_PROJECT_ID}/belka-repo/belkaml-trainer:${_COMMIT_SHA}',
    '-t', 'northamerica-northeast2-docker.pkg.dev/${_PROJECT_ID}/belka-repo/belkaml-trainer:latest',
    '-f', 'src/vertex_ai/components/training/Dockerfile',
    '.'
  ]

# Step 2: Push training component image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '--all-tags', 'northamerica-northeast2-docker.pkg.dev/${_PROJECT_ID}/belka-repo/belkaml-trainer']

# Step 3: Install Python dependencies and compile FINETUNE pipeline YAML
- name: 'python:3.12'
  entrypoint: 'bash'
  env: ['PYTHONPATH=/workspace/src']
  args:
    - '-c'
    - |
      pip install google-cloud-aiplatform kfp google-cloud-pipeline-components
      cd src/vertex_ai
      python jobs/finetune_pipeline_job.py

# Step 4: Upload compiled FINETUNE pipeline YAML to GCS
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'gsutil'
  args: ['cp', 'src/vertex_ai/finetune_pipeline.yaml', 'gs://belkaml_pipeline_artifacts/finetune_pipeline.yaml']

# Step 5 (OPTIONAL): Automatically trigger finetune pipeline run
# NOTE: You must provide a pretrained_model_id to run the finetune pipeline
# Uncomment the step below and update the pretrained_model_id parameter
# - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
#   entrypoint: 'gcloud'
#   args: [
#     'ai', 'pipelines', 'run',
#     '--display-name=Finetune pipeline run - ${_COMMIT_SHA}',
#     '--project=${_PROJECT_ID}',
#     '--region=northamerica-northeast2',
#     '--file=gs://belkaml_pipeline_artifacts/finetune_pipeline.yaml',
#     '--parameter-values', 'pretrained_model_id=projects/46518343354/locations/northamerica-northeast2/models/YOUR_MODEL_ID,bq_project_id=belkaml,bq_project_location=US,bq_dataset_id=belka_train_dataset,bq_table_id=all_data,aip_project_id=belkaml,aip_project_location=northamerica-northeast2,stratify_column=protein_name,target_column=binds'
#   ]

images:
- 'northamerica-northeast2-docker.pkg.dev/${_PROJECT_ID}/belka-repo/belkaml-trainer:${_COMMIT_SHA}'
- 'northamerica-northeast2-docker.pkg.dev/${_PROJECT_ID}/belka-repo/belkaml-trainer:latest'

substitutions:
  _PROJECT_ID: 'required'
  _COMMIT_SHA: 'latest'

logsBucket: 'gs://belka-cloudbuild-logs'
# options:
#   logging: CLOUD_LOGGING_ONLY
